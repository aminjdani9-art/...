<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>نيون - مصحح من الفيديو</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;height:100vh;width:100vw}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:brightness(1.5) contrast(1.3) saturate(1.2)}
#draw{position:fixed;inset:0;width:100%;height:100%;transform:scaleX(-1);z-index:2}
#point{position:fixed;inset:0;width:100%;height:100%;transform:scaleX(-1);z-index:3;pointer-events:none}
#palette{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);display:flex;gap:10px;background:rgba(0,0,0,.9);padding:14px 22px;border-radius:40px;z-index:10;border:1px solid #333}
.dot{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.dot.active{border-color:#fff;box-shadow:0 0 0 2px #000, 0 0 20px currentColor;transform:scale(1.2)}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="draw"></canvas>
<canvas id="point"></canvas>

<div style="position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:10">
<div style="background:rgba(0,0,0,.8);color:#0f0;padding:8px 14px;border-radius:20px;font:700 12px sans-serif;border:1px solid #0f0">● خدام</div>
<button onclick="D.clearRect(0,0,draw.width,draw.height)" style="background:#fff;border:0;padding:10px 20px;border-radius:20px;font-weight:900">مسح</button>
</div>

<div id="palette">
<button class="dot active" style="background:#ffffff;color:#ffffff" onclick="setC('#ffffff',this)"></button>
<button class="dot" style="background:#a020f0;color:#a020f0" onclick="setC('#a020f0',this)"></button>
<button class="dot" style="background:#ffff00;color:#ffff00" onclick="setC('#ffff00',this)"></button>
<button class="dot" style="background:#00aaff;color:#00aaff" onclick="setC('#00aaff',this)"></button>
<button class="dot" style="background:#ff0055;color:#ff0055" onclick="setC('#ff0055',this)"></button>
<button class="dot" style="background:#00ff88;color:#00ff88" onclick="setC('#00ff88',this)"></button>
</div>

<script>
let col='#ffffff';
const video=document.getElementById('video');
const draw=document.getElementById('draw');
const D=draw.getContext('2d');
const point=document.getElementById('point');
const P=point.getContext('2d');
let last=null,sx=0,sy=0;

function resize(){draw.width=point.width=innerWidth; draw.height=point.height=innerHeight; D.lineCap='round'; D.lineJoin='round';}
addEventListener('resize',resize); resize();

window.setC=(c,el)=>{
  col=c;
  document.querySelectorAll('.dot').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}

function neon(x1,y1,x2,y2){
  D.save();
  D.shadowBlur=25; D.shadowColor=col; D.strokeStyle=col; D.lineWidth=16; D.globalAlpha=0.6;
  D.beginPath(); D.moveTo(x1,y1); D.lineTo(x2,y2); D.stroke();
  D.shadowBlur=12; D.globalAlpha=1; D.lineWidth=4; D.strokeStyle='#fff';
  D.beginPath(); D.moveTo(x1,y1); D.lineTo(x2,y2); D.stroke();
  D.restore();
}

const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({maxNumHands:1, modelComplexity:0, minDetectionConfidence:0.5, minTrackingConfidence:0.5});

hands.onResults(r=>{
  P.clearRect(0,0,point.width,point.height);
  if(!r.multiHandLandmarks[0]){last=null; return;}
  const lm=r.multiHandLandmarks[0];
  let x=(1-lm[8].x)*point.width, y=lm[8].y*point.height;
  if(sx==0){sx=x; sy=y;} sx=sx*0.4+x*0.6; sy=sy*0.4+y*0.6; x=sx; y=sy;

  P.shadowBlur=15; P.shadowColor=col; P.fillStyle=col;
  P.beginPath(); P.arc(x,y,9,0,6.28); P.fill(); P.shadowBlur=0;
  P.strokeStyle='#fff'; P.lineWidth=2; P.stroke();

  const upI=lm[8].y<lm[6].y, upM=lm[12].y<lm[10].y;
  if(upI&&!upM){
    if(last) neon(last.x,last.y,x,y);
    last={x,y};
  } else if(upI&&upM){ D.clearRect(0,0,draw.width,draw.height); last=null; }
  else last=null;
});

async function start(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}}});
    video.srcObject=s;
    video.onloadeddata=()=>{new Camera(video,{onFrame:async()=>{await hands.send({image:video});},width:640,height:480}).start();}
  }catch(e){alert('خاصك تسمح للكاميرا');}
}
start();
</script>
</body>
  </html>
